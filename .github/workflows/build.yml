name: Build SeaBIOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            gcc \
            make \
            python3 \
            nasm \
            binutils

      - name: Build SeaBIOS
        run: bash build-seabios.sh

      - name: Upload BIOS image
        uses: actions/upload-artifact@v4
        with:
          name: bios.bin
          path: seabios/out/bios.bin
